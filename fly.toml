# Fly.io app config. Uses the existing Dockerfile — no separate build setup.
# `app` below is a placeholder; `fly launch` will ask you to pick a unique
# name (or edit it here) the first time you set this up.
app = "chess-game-analyzer"
primary_region = "ams"

[build]

[env]
  # 1GB RAM total for the whole VM (Python + Streamlit + pandas/plotly +
  # Stockfish). The 128MB default hash table is fine on a Codespace but
  # risks OOM-killing the process here mid-analysis; keep it small.
  CHESS_ANALYZER_HASH_MB = "32"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "chess_data"
  destination = "/app/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
