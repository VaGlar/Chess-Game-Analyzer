name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure the Fly app and data volume exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
          REGION=$(grep '^primary_region = ' fly.toml | cut -d'"' -f2)

          if ! flyctl apps list --json | jq -e --arg app "$APP" '.[] | select((.Name // .name) == $app)' >/dev/null; then
            flyctl apps create "$APP"
          fi

          if ! flyctl volumes list -a "$APP" --json | jq -e '.[] | select((.Name // .name) == "chess_data")' >/dev/null; then
            flyctl volumes create chess_data --app "$APP" --region "$REGION" --size 1 --yes
          fi

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
